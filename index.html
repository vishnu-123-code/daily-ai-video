<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily AI Video</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 30px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .video-box {
            width: 90%;
            max-width: 500px;
            margin: 20px auto;
            background: #222;
            border-radius: 15px;
            padding: 20px;
        }

        video {
            width: 100%;
            border-radius: 10px;
            background: black;
        }

        .message {
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎬 Daily AI Video</h1>
        <p>A new AI-generated video every day</p>
    </header>

    <div class="video-box">

        <video controls>
            <source src="" type="video/mp4">
            Your browser does not support video.
        </video>

        <p class="message">
            Today's AI video will appear here.
        </p>

    </div>

</body>
</html>
